name: Test — simplex-tuition-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simplex-tuition-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simplex-tuition-web/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simplex-tuition-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simplex-tuition-web/package-lock.json
      - run: npm ci
      # The action's own start/wait-on probe dies on the runner with "Socket closed before the
      # connection was established" before any retry, so the server is started and waited for
      # here, and the action only runs the specs.
      - run: npm run build
        env:
          VITE_FORMSPREE_URL: https://formspree.io/f/xlddjnre
      - name: Start the preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then echo "preview up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "preview never came up"; cat preview.log; exit 1
      - uses: cypress-io/github-action@v6
        with:
          working-directory: simplex-tuition-web
          install: false
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4173
          # The preview server serves the prerendered build, so the raw-HTML SEO checks run.
          CYPRESS_PRERENDERED: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: simplex-tuition-web/cypress/screenshots/
