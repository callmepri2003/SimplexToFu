name: Test — simplex-tuition-web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simplex-tuition-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simplex-tuition-web/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simplex-tuition-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: simplex-tuition-web/package-lock.json
      - run: npm ci
      - uses: cypress-io/github-action@v6
        with:
          working-directory: simplex-tuition-web
          build: npm run build
          # Bind to IPv4 and probe the same address: on the runner, "localhost"
          # resolves to ::1 first and the probe closed the socket before the server was up.
          start: npm run preview -- --host 127.0.0.1 --strictPort
          wait-on: 'http://127.0.0.1:4173'
          wait-on-timeout: 60
        env:
          VITE_FORMSPREE_URL: https://formspree.io/f/xlddjnre
          CYPRESS_BASE_URL: http://127.0.0.1:4173
          # The preview server serves the prerendered build, so the raw-HTML SEO checks run.
          CYPRESS_PRERENDERED: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: simplex-tuition-web/cypress/screenshots/
